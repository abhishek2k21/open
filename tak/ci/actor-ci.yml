name: Actor CI

on:
  push:
    paths:
      - 'tak/**'
      - '.github/workflows/actor-ci.yml'
  pull_request:
    paths:
      - 'tak/**'
  workflow_dispatch:

jobs:
  verify:
    name: Tests and schema validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest interpreter developers run locally (macOS system python).
        # 3.12 matches the apify/actor-python image used in production.
        python-version: ['3.9', '3.12']
    defaults:
      run:
        working-directory: tak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tak/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (offline)
        run: python -m pytest

      - name: Byte-compile Actor sources
        run: python -m compileall -q src

      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: '20'

      - name: Install Apify CLI
        if: matrix.python-version == '3.12'
        run: npm install -g apify-cli@1.10.0

      - name: Validate Actor schemas
        if: matrix.python-version == '3.12'
        run: apify validate-schema
